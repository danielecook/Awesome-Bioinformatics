name: 🌴 Generate TOC
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: technote-space/toc-generator@v4
        with:
          TOC_TITLE: "## Table of Contents"
